name: Server

on:
  push:
    branches: [main]
    paths: ["WattServer/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["WattServer/**", ".github/workflows/server.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WattServer/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: WattServer/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controleer Compose-bestand
        working-directory: WattServer
        run: cp .env.example .env && docker compose config --quiet
      - name: Bouw API-image
        run: docker build WattServer/api
