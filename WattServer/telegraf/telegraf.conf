# Leest de SDM630 via de USR-DR302 en schrijft naar TimescaleDB.
# Alleen functiecode 04 (lezen): Telegraf schrijft niets naar de meter.

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 500
  metric_buffer_limit = 20000      # ruim een dag aan metingen als de database even weg is
  flush_interval = "10s"
  omit_hostname = true

[[inputs.modbus]]
  name = "sdm630"
  controller = "tcp://${MODBUS_HOST}:${MODBUS_PORT}"
  transmission_mode = "${MODBUS_MODE}"
  timeout = "2s"
  busy_retries = 2
  busy_retries_wait = "200ms"
  configuration_type = "request"
  # Alleen de metingen zijn relevant; deze tags zouden extra kolommen geven.
  tagexclude = ["name", "type", "slave_id"]

  [inputs.modbus.workarounds]
    pause_between_requests = "100ms" # RS485 is half-duplex; geef de meter ademruimte

  # Adressen zijn de nulgebaseerde protocoladressen uit de Eastron-registertabel,
  # decimaal genoteerd (bijvoorbeeld 224 = 0x00E0 = register 30225).
  # Elke waarde is een big-endian float32 van twee registers.
  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "input"
    measurement = "sdm630"
    fields = [
      { address = 0, name = "voltage_l1",  type = "FLOAT32" },
      { address = 2, name = "voltage_l2",  type = "FLOAT32" },
      { address = 4, name = "voltage_l3",  type = "FLOAT32" },
      { address = 6, name = "current_l1",  type = "FLOAT32" },
      { address = 8, name = "current_l2",  type = "FLOAT32" },
      { address = 10, name = "current_l3",  type = "FLOAT32" },
      { address = 12, name = "power_l1",    type = "FLOAT32" },
      { address = 14, name = "power_l2",    type = "FLOAT32" },
      { address = 16, name = "power_l3",    type = "FLOAT32" },
      { address = 52, name = "power_total", type = "FLOAT32" },
      { address = 70, name = "frequency",   type = "FLOAT32" },
      { address = 72, name = "energy_import", type = "FLOAT32" },
      { address = 74, name = "energy_export", type = "FLOAT32" },
      { address = 224, name = "current_n",   type = "FLOAT32" },
      { address = 240, name = "current_thd_l1", type = "FLOAT32" },
      { address = 242, name = "current_thd_l2", type = "FLOAT32" },
      { address = 244, name = "current_thd_l3", type = "FLOAT32" },
      { address = 346, name = "energy_import_l1", type = "FLOAT32" },
      { address = 348, name = "energy_import_l2", type = "FLOAT32" },
      { address = 350, name = "energy_import_l3", type = "FLOAT32" },
    ]

[[outputs.postgresql]]
  # Wachtwoord komt uit PGPASSWORD. De tabel staat in db/init/01-schema.sql.
  connection = "host=timescaledb port=5432 user=energy dbname=energy sslmode=disable"
  timestamp_column_type = "timestamp with time zone"
